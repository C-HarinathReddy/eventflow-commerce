logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.hibernate: WARN

spring:
  kafka:
    properties:
      schema.registry.url: mock://order-tracking
    producer:
      properties:
        # fail fast while the broker is paused so the relay rolls back and retries next tick
        max.block.ms: 3000
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
