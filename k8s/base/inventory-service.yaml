apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      # Kubernetes injects <SERVICE>_PORT=tcp://... for every Service in the namespace; Confluent images
      # read <PREFIX>_* variables as configuration and choke on it. Nobody here needs service links.
      enableServiceLinks: false
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z kafka 9092 && nc -z schema-registry 8081 && nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: inventory-service
          image: order-tracking/inventory-service:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - { name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres:5432/inventory }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
